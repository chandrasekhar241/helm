apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  # service uses the below labels to select pods
  type: {{ .Values.service.type }}
  selector:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
  ports:
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #container port
